<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">English Center Platform — Architecture Version 2</title>
  <desc id="description">Implemented application core, planned data, analytics, observability and AI layers, and future advanced options.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f4f7f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#18324a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38566e"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#18324a}
      .title{font-size:36px;font-weight:700}.subtitle{font-size:17px;fill:#53697a}
      .lane-title{font-size:20px;font-weight:700}.box-title{font-size:17px;font-weight:700}
      .box-copy{font-size:14px;fill:#43596b}.small{font-size:13px;fill:#53697a}
      .lane{fill:#fff;stroke:#d6e0e7;stroke-width:1.5;rx:22}
      .implemented{fill:#e8f6ef;stroke:#16825d;stroke-width:2.2;rx:14}
      .planned{fill:#edf4ff;stroke:#2867b2;stroke-width:2.2;stroke-dasharray:8 5;rx:14}
      .future{fill:#f3f4f6;stroke:#6b7280;stroke-width:2.2;stroke-dasharray:4 6;rx:14}
      .arrow{fill:none;stroke:#38566e;stroke-width:2.2;marker-end:url(#arrow)}
      .planned-arrow{fill:none;stroke:#2867b2;stroke-width:2.2;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .future-arrow{fill:none;stroke:#6b7280;stroke-width:2;stroke-dasharray:3 6;marker-end:url(#arrow)}
    </style>
