name: english-center-platform

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in infrastructure/.env}"
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  api:
    build:
      context: ../apps/backend/EnglishCenter.Api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=EnglishCenter;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True"
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-5173}
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in infrastructure/.env}"
      Auth__BootstrapAdmin__Email: "${AUTH_BOOTSTRAP_ADMIN_EMAIL:?Set AUTH_BOOTSTRAP_ADMIN_EMAIL in infrastructure/.env}"
      Auth__BootstrapAdmin__Password: "${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?Set AUTH_BOOTSTRAP_ADMIN_PASSWORD in infrastructure/.env}"
      Messaging__RabbitMq__Enabled: "true"
      Messaging__RabbitMq__WorkerEnabled: "true"
      Messaging__RabbitMq__HostName: rabbitmq
      Messaging__RabbitMq__Port: "5672"
      Messaging__RabbitMq__VirtualHost: "/"
      Messaging__RabbitMq__UserName: "${RABBITMQ_USER:-ecp_app}"
      Messaging__RabbitMq__Password: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in infrastructure/.env}"
      Messaging__RabbitMq__ClientProvidedName: english-center-api
      Messaging__RabbitMq__PublishTimeoutSeconds: "10"
      Messaging__RabbitMq__RetryDelayMilliseconds: "1000"
      Messaging__RabbitMq__MaxRetryAttempts: "3"
      Messaging__RabbitMq__PrefetchCount: "1"
      Cache__Redis__Enabled: "true"
      Cache__Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env},abortConnect=false,connectTimeout=5000,syncTimeout=5000"
      Cache__Redis__InstanceName: "english-center:"
      Cache__Redis__DefaultTtlSeconds: "300"
      Cache__Redis__CourseListTtlSeconds: "60"
      RateLimiting__Redis__Enabled: "true"
      RateLimiting__Redis__Login__PermitLimit: "20"
      RateLimiting__Redis__Login__WindowSeconds: "60"
      RateLimiting__Redis__Refresh__PermitLimit: "10"
      RateLimiting__Redis__Refresh__WindowSeconds: "60"
      RateLimiting__Redis__Notifications__PermitLimit: "30"
      RateLimiting__Redis__Notifications__WindowSeconds: "60"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/api/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - app-network

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://127.0.0.1/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    networks:
      - app-network

  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env}"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?Set REDIS_PASSWORD in infrastructure/.env}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecp_app}
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in infrastructure/.env}"
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  postgres-dwh:
    image: postgres:18-alpine
    profiles: [data]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DWH_DATABASE:-english_center_dwh}
      POSTGRES_USER: ${POSTGRES_DWH_USER:-ecp_dwh}
      POSTGRES_PASSWORD: "${POSTGRES_DWH_PASSWORD:?Set POSTGRES_DWH_PASSWORD in infrastructure/.env}"
    ports:
      - "${POSTGRES_DWH_PORT:-5432}:5432"
    volumes:
      - postgres-dwh-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - data-network

  minio:
    image: quay.io/minio/minio:latest
    profiles: [data]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ecp_minio}
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in infrastructure/.env}"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - data-network

networks:
  app-network:
    driver: bridge
  data-network:
    driver: bridge

volumes:
  sqlserver-data:
  redis-data:
  rabbitmq-data:
  postgres-dwh-data:
  minio-data:
